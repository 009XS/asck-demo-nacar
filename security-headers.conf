# Cabeceras de seguridad — se INCLUYEN en cada bloque location.
#
# nginx no hereda `add_header` hacia un location que declara los suyos: en
# cuanto un location añade una cabecera, pierde todas las del nivel server.
# Por eso esto es un parcial que se incluye en todos, en lugar de declararlo
# una sola vez arriba. Si añades un location nuevo, incluye el parcial.

add_header X-Content-Type-Options     "nosniff"                         always;
add_header X-Frame-Options            "SAMEORIGIN"                      always;
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin"                     always;
add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# El sitio es 100 % de origen propio: ni fuentes, ni scripts, ni imágenes de
# terceros. Los CTA navegan a wa.me, cosa que la CSP no restringe.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# Demo comercial: fuera de los buscadores.
add_header X-Robots-Tag "noindex, nofollow" always;
