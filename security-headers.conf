# Cabeceras de seguridad — se INCLUYEN en cada bloque location.
add_header X-Content-Type-Options     "nosniff"                         always;
add_header X-Frame-Options            "SAMEORIGIN"                      always;
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin"                     always;
add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# CSP permisiva para Google Fonts, Unsplash y assets HTTPS
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self' https:; font-src 'self' https: data:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline'; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# Demo comercial: fuera de los buscadores
add_header X-Robots-Tag "noindex, nofollow" always;
