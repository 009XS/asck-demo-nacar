# NÁCAR — servidor estático del contenedor.
#
# Vive DENTRO de la imagen. No toca la configuración del VPS ni el Traefik de
# Coolify, que es quien termina TLS y enruta el subdominio hasta aquí.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # --- compresión -------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/manifest+json;
    # woff2 ya viene comprimido: recomprimir sólo gasta CPU.

    # --- assets versionados por Vite: inmutables --------------------------
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- secuencia de la película: inmutable y versionada ------------------
    # Los nombres (c01-001.webp…) son estables entre versiones, así que el
    # `immutable` sólo es seguro porque `manifest.json` sirve cada fotograma
    # con `?v=<huella del set>`: al cambiar los binarios cambia la URL. El
    # manifiesto, que es el índice, NO se cachea (abajo).
    location /film/desktop/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location /film/mobile/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # El índice de la película manda: si se sirviera cacheado, el `?v=` de los
    # fotogramas nunca llegaría al navegador y el `immutable` de arriba
    # congelaría la secuencia anterior.
    location = /film/manifest.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Pósters y láminas del modo quieto: nombre estable y sin huella, así que
    # una semana con revalidación, nunca `immutable`.
    location /film/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # --- fuentes con nombre estable ---------------------------------------
    location /fonts/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # --- raíz --------------------------------------------------------------
    # Sin fallback a /index.html: no hay router de cliente, así que devolver
    # 200 en cualquier ruta inexistente sólo enmascara enlaces rotos.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/security-headers.conf;
        internal;
    }

    location = /robots.txt {
        include /etc/nginx/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /healthz {
        include /etc/nginx/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
